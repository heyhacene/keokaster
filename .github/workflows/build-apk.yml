name: Compiler APK Android Keo Kaster

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Keo Kaster APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Installation des dépendances
        run: npm install

      - name: Construction de l'application Web (Next.js export)
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

      - name: Initialisation du projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Génération des icônes Android depuis le logo SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/values

          # 1. Icônes classiques et rondes
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # 2. Icônes adaptatives Android 8+ (ic_launcher_foreground.png)
          rsvg-convert -w 108 -h 108 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          rsvg-convert -w 162 -h 162 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          rsvg-convert -w 216 -h 216 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          rsvg-convert -w 324 -h 324 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          rsvg-convert -w 432 -h 432 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          # 3. Fond adaptatif sombre aux couleurs de Keo Kaster (#0b0f19)
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0b0f19</color>
          </resources>
          EOF

          if [ -f "android/app/src/main/res/values/colors.xml" ]; then
            sed -i 's/<color name="ic_launcher_background">.*<\/color>/<color name="ic_launcher_background">#0b0f19<\/color>/g' android/app/src/main/res/values/colors.xml
          fi

      - name: Configuration des permissions Android (Audio en arrière-plan et trafic HTTP)
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Configuration de la version Android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Compilation et Signature de l'APK Android
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

          KEYSTORE_FILE="keokaster-release.keystore"
          if [ -f "../keokaster.keystore" ]; then
            echo "🔑 Utilisation du keystore fixe et permanent keokaster.keystore..."
            cp "../keokaster.keystore" "$KEYSTORE_FILE"
            ALIAS=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass keokaster2026 | grep -E "PrivateKeyEntry|clé privée" | head -n 1 | cut -d',' -f1 | cut -d' ' -f1 | tr -d '\r' | tr -d ' ')
            if [ -z "$ALIAS" ]; then
              ALIAS=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass keokaster2026 | grep -i "alias" | head -n 1 | awk -F': ' '{print $2}' | tr -d '\r' | tr -d ' ')
            fi
            if [ -z "$ALIAS" ]; then
              ALIAS="keokaster"
            fi
            echo "🔑 Alias détecté : $ALIAS"
          else
            echo "⚠️ Création d'un nouveau keystore de secours..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias keokaster \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass keokaster2026 \
              -keypass keokaster2026 \
              -dname "CN=Keo Kaster, OU=Keo, O=Keo, L=Paris, ST=IDF, C=FR"
            ALIAS="keokaster"
          fi

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
            $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
            UNSIGNED_APK="aligned.apk"
          fi

          mkdir -p ../build-output
          $APKSIGNER sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:keokaster2026" \
            --key-pass "pass:keokaster2026" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../build-output/KeoKaster.apk \
            "$UNSIGNED_APK"

          $APKSIGNER verify --verbose ../build-output/KeoKaster.apk
          rm -f "$KEYSTORE_FILE" aligned.apk
          cp ../build-output/KeoKaster.apk "../build-output/KeoKaster-Build-${{ github.run_number }}.apk"

      - name: Publication de l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KeoKaster-Release-APK
          path: |
            build-output/KeoKaster.apk
            build-output/KeoKaster-Build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Création / Mise à jour de la Release GitHub avec l'APK direct
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "Keo Kaster v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## 🎙️⚡ Keo Kaster — Version 1.0.0 (Build ${{ github.run_number }})
            
            Lecteur de podcasts moderne, souple, synchronisé et sans coupures publicitaires.
            
            ### ✨ Nouveautés majeures (Build ${{ github.run_number }}) :
            - 📥 **Rapatriement de podcasts universel** : Importez vos abonnements depuis Spotify, Apple Podcasts, Pocket Casts, AntennaPod, Podcast Addict via fichiers OPML standards ou en collant directement un lien.
            - 📶 **Mode Hors-Ligne & Téléchargements** : Téléchargez vos épisodes en local pour les écouter en avion, dans le train ou le métro sans connexion ni data.
            - 🚗 **Mode Voiture Sécurisé (Car Mode)** : Interface de conduite ultra-lisible avec boutons géants (Play XXL, saut pub +60s instantané, -15s/+30s).
            - 🪄 **Playlists Intelligentes Dynamiques** : 4 sélections automatiques (Nouveautés 48h, Trajet Rapide <20 min, Reprendre la lecture, Sagas multi-parties 1/4, 2/4...).
            - ⚡ **Moteur Anti-Pub IA ZeroPub & Filtrage optimisé** : Détection sémantique, saut instantané des sponsors et exclusion sélective par podcast.
            
            ### 📲 Téléchargement direct :
            - **Fichier principal** : [KeoKaster-Build-${{ github.run_number }}.apk](https://github.com/heyhacene/keokaster/releases/download/v1.0.0-build.${{ github.run_number }}/KeoKaster-Build-${{ github.run_number }}.apk)
            - **Lien permanent** : [KeoKaster.apk](https://github.com/heyhacene/keokaster/releases/latest/download/KeoKaster.apk)
          files: |
            build-output/KeoKaster.apk
            build-output/KeoKaster-Build-${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
