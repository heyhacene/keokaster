<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#7e22ce" stroke-width="8" opacity="0.4" />

  <!-- Outer Radio Waves -->
  <path d="M 120 180 A 170 170 0 0 0 120 332" fill="none" stroke="url(#purpleGrad)" stroke-width="24" stroke-linecap="round" opacity="0.6" />
  <path d="M 392 180 A 170 170 0 0 1 392 332" fill="none" stroke="url(#purpleGrad)" stroke-width="24" stroke-linecap="round" opacity="0.6" />

  <!-- Inner Radio Waves -->
  <path d="M 160 210 A 110 110 0 0 0 160 302" fill="none" stroke="url(#purpleGrad)" stroke-width="22" stroke-linecap="round" opacity="0.85" />
  <path d="M 352 210 A 110 110 0 0 1 352 302" fill="none" stroke="url(#purpleGrad)" stroke-width="22" stroke-linecap="round" opacity="0.85" />

  <!-- Center Microphone / Antenna Body -->
  <rect x="226" y="170" width="60" height="120" rx="30" fill="url(#purpleGrad)" />

  <!-- Microphone Arc Stand -->
  <path d="M 206 240 A 50 50 0 0 0 306 240" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="290" x2="256" y2="340" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />
  <line x1="216" y1="340" x2="296" y2="340" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" />

  <!-- ZeroPub Lightning Spark Badge -->
  <circle cx="340" cy="170" r="38" fill="#10b981" />
  <path d="M 344 146 L 326 172 L 340 172 L 336 194 L 354 168 L 340 168 Z" fill="#ffffff" />
</svg>
