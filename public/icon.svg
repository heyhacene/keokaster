<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arrière-plan dégradé sombre tech -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#190e38" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>

    <!-- Lettre K stylisée néon -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Dégradé pelage castor -->
    <linearGradient id="furBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="furHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Casque audio podcast -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ruban PUB découpé / croqué -->
    <linearGradient id="pubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Éclair / étincelles -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ombre douce -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowSpark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. FOND SQUIRCLE -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="117" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.35" />

  <!-- 2. LE GRAND "K" GÉOMÉTRIQUE EN ARRIÈRE-PLAN -->
  <g filter="url(#softShadow)" opacity="0.45">
    <!-- Tronc vertical du K -->
    <path d="M 100 90 L 160 90 L 160 422 L 100 422 Z" fill="url(#kGrad)" />
    <!-- Diagonale haute du K -->
    <path d="M 155 260 L 290 100 L 375 100 L 210 290 Z" fill="url(#kGrad)" />
    <!-- Diagonale basse du K -->
    <path d="M 195 275 L 375 422 L 290 422 L 155 315 Z" fill="url(#kGrad)" />
  </g>

  <!-- ONDES SONORES / PODCAST EN ARRIÈRE-PLAN -->
  <g opacity="0.25" stroke="#c084fc" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 68 220 A 210 210 0 0 0 68 292" />
    <path d="M 444 220 A 210 210 0 0 1 444 292" />
    <path d="M 46 195 A 240 240 0 0 0 46 317" />
    <path d="M 466 195 A 240 240 0 0 1 466 317" />
  </g>

  <!-- 3. ARCEAU DU CASQUE AUDIO (derrière les oreilles) -->
  <path d="M 152 230 C 152 120, 360 120, 360 230" fill="none" stroke="url(#headphoneGrad)" stroke-width="22" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- 4. OREILLES DU CASTOR -->
  <!-- Oreille gauche -->
  <ellipse cx="178" cy="165" rx="26" ry="30" transform="rotate(-15 178 165)" fill="url(#furBase)" />
  <ellipse cx="178" cy="165" rx="16" ry="20" transform="rotate(-15 178 165)" fill="#f43f5e" opacity="0.7" />
  <!-- Oreille droite -->
  <ellipse cx="334" cy="165" rx="26" ry="30" transform="rotate(15 334 165)" fill="url(#furBase)" />
  <ellipse cx="334" cy="165" rx="16" ry="20" transform="rotate(15 334 165)" fill="#f43f5e" opacity="0.7" />

  <!-- 5. TÊTE DU CASTOR -->
  <!-- Base de la tête avec joues rebondies -->
  <path d="M 170 180 C 170 140, 342 140, 342 180 C 375 210, 385 285, 345 325 C 310 355, 202 355, 167 325 C 127 285, 137 210, 170 180 Z" fill="url(#furBase)" filter="url(#softShadow)" />

  <!-- Reflet / teinte pelage sur le front -->
  <path d="M 195 185 C 215 160, 297 160, 317 185 C 325 215, 315 240, 256 242 C 197 240, 187 215, 195 185 Z" fill="url(#furHighlight)" />

  <!-- ÉCOUTEURS DU CASQUE AUDIO (sur les côtés) -->
  <!-- Écouteur gauche -->
  <g filter="url(#softShadow)">
    <rect x="130" y="195" width="28" height="65" rx="14" fill="#0f172a" stroke="url(#headphoneGrad)" stroke-width="5" />
    <circle cx="144" cy="227" r="8" fill="#38bdf8" />
  </g>
  <!-- Écouteur droit -->
  <g filter="url(#softShadow)">
    <rect x="354" y="195" width="28" height="65" rx="14" fill="#0f172a" stroke="url(#headphoneGrad)" stroke-width="5" />
    <circle cx="368" cy="227" r="8" fill="#38bdf8" />
  </g>

  <!-- YEUX EXPRESSIFS DU CASTOR (concentré & déterminé) -->
  <!-- Œil gauche -->
  <ellipse cx="215" cy="218" rx="16" ry="20" fill="#0f172a" />
  <circle cx="210" cy="212" r="6" fill="#ffffff" />
  <circle cx="221" cy="224" r="2.5" fill="#ffffff" />
  <!-- Sourcil gauche déterminé -->
  <path d="M 196 195 Q 215 198 230 205" fill="none" stroke="#451a03" stroke-width="5" stroke-linecap="round" />

  <!-- Œil droit -->
  <ellipse cx="297" cy="218" rx="16" ry="20" fill="#0f172a" />
  <circle cx="292" cy="212" r="6" fill="#ffffff" />
  <circle cx="303" cy="224" r="2.5" fill="#ffffff" />
  <!-- Sourcil droit déterminé -->
  <path d="M 316 195 Q 297 198 282 205" fill="none" stroke="#451a03" stroke-width="5" stroke-linecap="round" />

  <!-- MUSEAU DU CASTOR (JOUES CRÈME) -->
  <g filter="url(#softShadow)">
    <!-- Joue gauche du museau -->
    <ellipse cx="232" cy="268" rx="34" ry="25" fill="url(#snoutGrad)" />
    <!-- Joue droite du museau -->
    <ellipse cx="280" cy="268" rx="34" ry="25" fill="url(#snoutGrad)" />
    <!-- Pont supérieur -->
    <ellipse cx="256" cy="254" rx="20" ry="14" fill="url(#snoutGrad)" />
  </g>

  <!-- TRUFFE / NEZ NOIR -->
  <path d="M 243 246 C 243 240, 269 240, 269 246 C 269 254, 258 262, 256 262 C 254 262, 243 254, 243 246 Z" fill="#1e1b4b" />
  <!-- Reflet sur la truffe -->
  <ellipse cx="252" cy="245" rx="4" ry="2" fill="#ffffff" opacity="0.8" />

  <!-- BOUCHE OUVERTE QUI CROQUE -->
  <path d="M 234 278 Q 256 312 278 278 Z" fill="#450a0a" />

  <!-- 6. LES DENTS DU CASTOR (GRANDES INCISIVES BLANCHES TRANCHANTES) -->
  <!-- Les deux incisives emblématiques qui mordent la pub -->
  <g filter="url(#softShadow)">
    <!-- Incisive gauche -->
    <rect x="240" y="278" width="15" height="28" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Incisive droite -->
    <rect x="257" y="278" width="15" height="28" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Séparation des dents -->
    <line x1="256" y1="278" x2="256" y2="306" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- 7. LE PANNEAU / RUBAN « PUB » QUI SE FAIT CROQUER & COUPER EN DEUX ! -->
  <!-- Morceau GAUCHE du ruban PUB (croqué et brisé) -->
  <g filter="url(#softShadow)">
    <path d="M 125 316 L 246 295 L 250 318 L 243 325 L 250 338 L 138 358 Z" fill="url(#pubGrad)" stroke="#fca5a5" stroke-width="2" />
    <text x="162" y="342" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1.5" transform="rotate(-6 162 342)">P</text>
    <text x="200" y="338" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1.5" transform="rotate(-6 200 338)">U</text>
  </g>

  <!-- Morceau DROIT du ruban PUB (fissuré et projeté vers le bas) -->
  <g filter="url(#softShadow)">
    <path d="M 264 298 L 387 320 L 374 362 L 262 342 L 269 330 L 261 320 Z" fill="url(#pubGrad)" stroke="#fca5a5" stroke-width="2" />
    <text x="306" y="346" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1.5" transform="rotate(7 306 346)">B</text>
  </g>

  <!-- FRACTURE, ÉCLAT ET ÉTINCELLES AU POINT DE MORSURE (ZERO PUB EFFECT) -->
  <!-- Éclair central qui jaillit de la morsure -->
  <path d="M 256 304 L 248 322 L 258 325 L 249 344 L 266 319 L 256 317 Z" fill="url(#sparkGrad)" filter="url(#glowSpark)" />

  <!-- Petites étincelles d'impact de dentition -->
  <circle cx="236" cy="302" r="4" fill="#fde047" filter="url(#glowSpark)" />
  <circle cx="276" cy="306" r="4.5" fill="#fde047" filter="url(#glowSpark)" />
  <circle cx="256" cy="355" r="3.5" fill="#38bdf8" filter="url(#glowSpark)" />
  <circle cx="225" cy="336" r="3" fill="#facc15" />
  <circle cx="286" cy="332" r="3" fill="#facc15" />

  <!-- Petite patte gauche du castor qui tient le panneau -->
  <g filter="url(#softShadow)">
    <ellipse cx="140" cy="340" rx="18" ry="14" fill="url(#furBase)" />
    <circle cx="130" cy="342" r="4" fill="#451a03" />
    <circle cx="138" cy="346" r="4" fill="#451a03" />
    <circle cx="147" cy="344" r="4" fill="#451a03" />
  </g>

  <!-- Petite patte droite du castor qui tient l'autre morceau -->
  <g filter="url(#softShadow)">
    <ellipse cx="372" cy="344" rx="18" ry="14" fill="url(#furBase)" />
    <circle cx="365" cy="350" r="4" fill="#451a03" />
    <circle cx="374" cy="352" r="4" fill="#451a03" />
    <circle cx="382" cy="348" r="4" fill="#451a03" />
  </g>

  <!-- 8. BADGE ZEROPUB AU BAS DU LOGO -->
  <g transform="translate(196, 436)" filter="url(#softShadow)">
    <rect width="120" height="28" rx="14" fill="#10b981" />
    <path d="M 212 444 L 204 452 L 208 452 L 206 458 L 214 450 L 210 450 Z" fill="#ffffff" />
    <text x="44" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1">ZERO PUB</text>
  </g>
</svg>
